    <script>
      (function () {
        var root = document.getElementById("root");

          window.__hyperframes && window.__hyperframes.getVariables
            ? window.__hyperframes.getVariables()
            : {};
        var icon = vars.icon || "voice";
        if (vars.accent) root.style.setProperty("--accent", vars.accent);
        var icons = root.querySelectorAll(".fc-icon");
        var active = null;
        for (var i = 0; i < icons.length; i++) {
          if (icons[i].getAttribute("data-icon") === icon) {
            icons[i].style.display = "block";
            active = icons[i];
          }
        }

        var card = root.querySelector("#fc-card");
        if (vars.title) {
          root.querySelector("#fc-title").textContent = vars.title;
          if (vars.title.length > 24) root.querySelector("#fc-title").classList.add("is-long");
        }
        if (vars.sub) root.querySelector("#fc-sub").textContent = vars.sub;
        if (vars.num) root.querySelector("#fc-badge").textContent = vars.num;
        if (vars.accent) root.querySelector("#fc-art").style.backgroundColor = vars.accent;
        var badge = root.querySelector("#fc-badge");
        var art = root.querySelector("#fc-art");
        var title = root.querySelector("#fc-title");
        var sub = root.querySelector("#fc-sub");

        var stamp = root.querySelector("#fc-stamp");
        if (vars.stamp) {
          stamp.textContent = vars.stamp;
          stamp.style.display = "block";
          if (/STIMMT|WAHR/i.test(vars.stamp)) stamp.classList.add("is-true");
        }

        var tl = gsap.timeline({ paused: true });
        var side = (parseInt(vars.num || "1", 10) % 2) ? -1 : 1;
        tl.fromTo(card, { x: 260 * side, y: 40, rotation: 6 * side, scale: 0.86, opacity: 0 }, { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1, duration: 0.3, ease: "back.out(1.7)" }, 0);
        tl.fromTo(badge, { scale: 0, rotation: -30 }, { scale: 1, rotation: -6, duration: 0.3, ease: "back.out(2.8)" }, 0.06);
        tl.fromTo(art, { scale: 0.5 }, { scale: 1, duration: 0.36, ease: "back.out(2.6)" }, 0.1);
        tl.fromTo(title, { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: "power3.out" }, 0.14);
        tl.fromTo(sub, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.22, ease: "power3.out" }, 0.28);

        if (active) {
          tl.fromTo(active, { rotation: -5, transformOrigin: "50% 50%" }, { rotation: 5, duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0.45);
          var lid = active.querySelector(".fc-lid");
          if (lid) {
            tl.fromTo(lid, { scaleY: 0.08, transformOrigin: "50% 52%" }, { scaleY: 1, duration: 0.3, ease: "back.out(2)" }, 0.4);
          }
          var waves = active.querySelectorAll(".fc-waves path");
          if (waves.length) {
            tl.fromTo(waves, { opacity: 0.15 }, { opacity: 1, duration: 0.25, stagger: 0.06, yoyo: true, repeat: 3 }, 0.4);
          }
          var bubs = active.querySelectorAll(".fc-bub");
          if (bubs.length) {
            tl.fromTo(bubs, { y: 0 }, { y: -20, duration: 0.2, ease: "power2.out", yoyo: true, repeat: 5, stagger: 0.1 }, 0.4);
          }
        }

        if (vars.stamp) {
          tl.fromTo(stamp, { scale: 2.4, opacity: 0, rotation: 14 }, { scale: 1, opacity: 1, rotation: 10, duration: 0.22, ease: "power4.in" }, 0.55);
          tl.fromTo(card, { x: 0 }, { x: 10, duration: 0.05, yoyo: true, repeat: 3, immediateRender: false }, 0.77);
        }
        tl.fromTo(badge, { scale: 1 }, { scale: 1.12, duration: 0.22, ease: "sine.inOut", yoyo: true, repeat: 1, immediateRender: false }, 1.0);
        // exit
        var dur = Number(vars.dur) || 3.2;
